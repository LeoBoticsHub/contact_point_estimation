contact_point_estimation_node:
  ros__parameters:
    # gains of surface normal estimator
    sim: true
    gamma_n: 250000.0 # test fixed cf 2500000.0 # original 250000.0 (rate of convergence)
    beta_n: 1000.0 # test fixed cf 100.0 #original 150.0 (small Beta = long memory)

    # initial surface normal (in base frame)
    initial_n: [0.0, 0.0, 1.0] #  [-0.707, 0.0, 0.707] # [0.35, 0.35, 0.866] # 

    # update frequency of surface normal estimator [Hz]
    sne_update_frequency: 500.0